name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system deps (qpdf + ghostscript)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qpdf ghostscript

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest

      - name: Regenerate fixtures + preview stubs
        run: python -m generate.pipeline

      - name: Verify catalog shape
        run: |
          test -f static/catalog.json
          test -f static/llms.txt
          test -f static/openapi.json
          python3 -c "
          import json
          d = json.loads(open('static/catalog.json').read())
          assert d['schema_version'] == '1.0.0', d['schema_version']
          assert d['fixture_count'] >= 50, d['fixture_count']
          assert len(d['fixtures']) == d['fixture_count']
          print(f'catalog.json shape OK: {d[\"fixture_count\"]} fixtures')
          "

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: latest
          extended: true

      - name: Build site
        run: hugo --minify

      - name: Smoke-check output
        run: |
          test -f public/index.html
          test -f public/catalog.json
          test -f public/by-fault/index.html
          test -f public/by-document/index.html
          test -f public/by-provenance/index.html
          test -f public/by-spec/index.html
          test -f public/by-form-factor/index.html
          test -f public/about/index.html
          test -f public/license/index.html
          test -f public/credits/index.html
          test -f public/404.html
          test -f public/llms.txt
          test -f public/preview/xref-truncated/index.html
          echo "All expected outputs present."

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
