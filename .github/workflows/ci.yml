name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache apt packages (ghostscript)
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: ghostscript
          version: "1"

      - name: Set up Python (with pip cache)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest

      - name: Verify catalog shape
        run: |
          test -f static/catalog.json
          test -f static/llms.txt
          test -f static/openapi.json
          python3 -c "
          import json
          d = json.loads(open('static/catalog.json').read())
          assert d['schema_version'] == '1.0.0', d['schema_version']
          assert d['fixture_count'] >= 50, d['fixture_count']
          assert len(d['fixtures']) == d['fixture_count']
          print(f'catalog.json shape OK: {d[\"fixture_count\"]} fixtures')
          "

      - name: Set up Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: latest
          extended: true

      - name: Build site
        run: hugo --minify

      - name: Smoke-check output
        run: |
          for f in \
            public/index.html \
            public/catalog.json \
            public/by-fault/index.html \
            public/by-document/index.html \
            public/by-provenance/index.html \
            public/by-spec/index.html \
            public/by-form-factor/index.html \
            public/about/index.html \
            public/license/index.html \
            public/credits/index.html \
            public/404.html \
            public/llms.txt \
            public/preview/xref-truncated/index.html ; do
              test -f "$f" || { echo "missing $f" >&2; exit 1; }
          done
          echo "All expected outputs present."

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: ci
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
