name: build

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, production]

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system deps (qpdf + ghostscript)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qpdf ghostscript

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest

      - name: Regenerate fixtures + preview stubs
        run: python -m generate.pipeline

      - name: Verify no drift in static/ or content/preview/
        run: |
          git diff --exit-code static/ content/preview/ || {
            echo "::error::static/ or content/preview/ drifted - regenerate locally and commit"
            git --no-pager diff --stat static/ content/preview/
            exit 1
          }

  hugo:
    runs-on: ubuntu-latest
    needs: pipeline
    steps:
      - uses: actions/checkout@v4

      - name: Set up Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: latest
          extended: true

      - name: Build site
        run: hugo --minify

      - name: Smoke-check output
        run: |
          test -f public/index.html
          test -f public/catalog.json
          test -f public/by-fault/index.html
          test -f public/by-document/index.html
          test -f public/by-provenance/index.html
          test -f public/by-spec/index.html
          test -f public/by-form-factor/index.html
          test -f public/about/index.html
          test -f public/license/index.html
          test -f public/llms.txt
          # Spot-check a known-good preview page exists
          test -f public/preview/xref-truncated/index.html
          echo "All expected outputs present."
