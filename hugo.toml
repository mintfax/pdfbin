baseURL = "https://mintfax.github.io/pdfbin/"
languageCode = "en-us"
title = "pdfbin.net"
enableRobotsTXT = false

# baseURL above reflects the current GitHub Pages project-site URL.
# When pdfbin.net is registered + pointed at GH Pages with a CNAME, change
# baseURL to "https://pdfbin.net" - all template links use {{ relURL ... }}
# so the path prefix follows baseURL automatically.

[params]
description = "A free library of test PDFs at stable URLs you can drop into your test suite."
bootstrap_version = "5.3.3"
bootstrap_css_sri = "sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"

[markup.goldmark.renderer]
unsafe = true

[outputs]
home = ["HTML"]
section = ["HTML"]
page = ["HTML"]
