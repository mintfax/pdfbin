<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
  {{ partial "head.html" . }}
</head>
<body>
  {{ partial "nav.html" . }}
  <main>
    {{ block "main" . }}{{ end }}
  </main>
  {{ partial "footer.html" . }}
  <script>
    // Copy-to-clipboard: any element with [data-copy="..."] copies its value on click.
    // The URL inside the cell remains text-selectable - this is just an affordance,
    // not a requirement for using the catalog.
    document.addEventListener('click', function (e) {
      var btn = e.target.closest('[data-copy]');
      if (!btn) return;
      var text = btn.getAttribute('data-copy');
      navigator.clipboard.writeText(text).then(function () {
        var orig = btn.textContent;
        btn.textContent = 'copied';
        btn.classList.add('btn-copied');
        setTimeout(function () {
          btn.textContent = orig;
          btn.classList.remove('btn-copied');
        }, 1500);
      });
    });
  </script>
</body>
</html>
