<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
  {{ partial "head.html" . }}
</head>
<body>
  {{ partial "nav.html" . }}
  <main>
    {{ block "main" . }}{{ end }}
  </main>
  {{ partial "footer.html" . }}
  <script>
    // Copy-to-clipboard: any element with [data-copy="..."] copies its value
    // on click. Uses navigator.clipboard on HTTPS, falls back to a hidden
    // <textarea> + document.execCommand('copy') on HTTP / older browsers.
    function pdfbinCopy(text) {
      if (navigator.clipboard && window.isSecureContext) {
        return navigator.clipboard.writeText(text);
      }
      return new Promise(function (resolve, reject) {
        var ta = document.createElement('textarea');
        ta.value = text;
        ta.setAttribute('readonly', '');
        ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0;pointer-events:none;';
        document.body.appendChild(ta);
        ta.select();
        ta.setSelectionRange(0, ta.value.length);
        try {
          var ok = document.execCommand('copy');
          document.body.removeChild(ta);
          ok ? resolve() : reject(new Error('execCommand returned false'));
        } catch (err) {
          document.body.removeChild(ta);
          reject(err);
        }
      });
    }
    document.addEventListener('click', function (e) {
      var btn = e.target.closest('[data-copy]');
      if (!btn) return;
      var text = btn.getAttribute('data-copy');
      if (!text) return;
      var orig = btn.textContent;
      pdfbinCopy(text).then(function () {
        btn.textContent = 'copied';
        btn.classList.add('btn-copied');
      }).catch(function () {
        btn.textContent = 'copy failed';
      }).finally(function () {
        setTimeout(function () {
          btn.textContent = orig;
          btn.classList.remove('btn-copied');
        }, 1500);
      });
    });

    // When previewing on a non-canonical host (e.g. pdfbin.example.dev),
    // rewrite every visible URL, href, src, and data-copy payload that points
    // at https://pdfbin.net/ so the page is self-consistent: what you see in
    // the row is what the copy button gives you.
    (function () {
      var canonical = 'https://pdfbin.net/';
      if (window.location.hostname === 'pdfbin.net') return;
      var here = window.location.origin + '/';
      document.querySelectorAll('a[href^="' + canonical + '"]').forEach(function (a) {
        a.setAttribute('href', a.getAttribute('href').split(canonical).join(here));
      });
      document.querySelectorAll('embed[src^="' + canonical + '"]').forEach(function (e) {
        e.setAttribute('src', e.getAttribute('src').split(canonical).join(here));
      });
      document.querySelectorAll('[data-copy]').forEach(function (el) {
        var v = el.getAttribute('data-copy');
        if (v && v.indexOf(canonical) !== -1) {
          el.setAttribute('data-copy', v.split(canonical).join(here));
        }
      });
      (function walk(node) {
        if (node.nodeType === 3) {
          if (node.nodeValue.indexOf(canonical) !== -1) {
            node.nodeValue = node.nodeValue.split(canonical).join(here);
          }
          return;
        }
        if (node.nodeType !== 1) return;
        var tag = node.tagName;
        if (tag === 'SCRIPT' || tag === 'STYLE') return;
        for (var c = node.firstChild; c; c = c.nextSibling) walk(c);
      })(document.body);
    })();

    // Row-as-link: clicking anywhere on a [data-row-href] row navigates to
    // that URL, except when the click lands on a real link or button (so the
    // copy button and existing anchors keep working unchanged).
    (function () {
      function targetIsInteractive(el, row) {
        for (var n = el; n && n !== row; n = n.parentNode) {
          if (n.nodeType !== 1) continue;
          var tag = n.tagName;
          if (tag === 'A' || tag === 'BUTTON' || tag === 'INPUT' ||
              tag === 'TEXTAREA' || tag === 'SELECT' || tag === 'LABEL') {
            return true;
          }
        }
        return false;
      }
      document.addEventListener('click', function (e) {
        if (e.defaultPrevented || e.button !== 0) return;
        if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
        var row = e.target.closest('[data-row-href]');
        if (!row) return;
        if (targetIsInteractive(e.target, row)) return;
        if (window.getSelection && String(window.getSelection())) return;
        window.location.href = row.getAttribute('data-row-href');
      });
      document.addEventListener('auxclick', function (e) {
        if (e.button !== 1) return;
        var row = e.target.closest('[data-row-href]');
        if (!row) return;
        if (targetIsInteractive(e.target, row)) return;
        window.open(row.getAttribute('data-row-href'), '_blank', 'noopener');
      });
    })();

    // Tab switching for [data-pdfbin-tabs] containers (homepage quick-start).
    // Hand-rolled to avoid pulling in Bootstrap's full JS bundle.
    (function () {
      function primeCopy(tabs) {
        var activePre = tabs.querySelector('.tab-pane.active pre');
        var copy = tabs.querySelector('[data-copy-active]');
        if (activePre && copy) copy.setAttribute('data-copy', activePre.innerText);
      }
      document.querySelectorAll('[data-pdfbin-tabs]').forEach(primeCopy);
      document.addEventListener('click', function (e) {
        var btn = e.target.closest('[data-pdfbin-tab]');
        if (!btn) return;
        var tabs = btn.closest('[data-pdfbin-tabs]');
        if (!tabs) return;
        var target = btn.getAttribute('data-pdfbin-tab');
        tabs.querySelectorAll('[data-pdfbin-tab]').forEach(function (b) {
          var on = b === btn;
          b.classList.toggle('active', on);
          b.setAttribute('aria-selected', on ? 'true' : 'false');
        });
        tabs.querySelectorAll('[data-pdfbin-pane]').forEach(function (p) {
          var on = p.getAttribute('data-pdfbin-pane') === target;
          p.classList.toggle('show', on);
          p.classList.toggle('active', on);
        });
        primeCopy(tabs);
      });
    })();
  </script>
</body>
</html>
