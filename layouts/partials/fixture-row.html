{{/* Render one fixture as a <tr>. Expects a fixture record from catalog.json. */}}
<tr class="fixture-row">
  <td><code class="id"><a href="{{ printf "preview/%s/" .id | relURL }}" class="text-decoration-none">{{ .id }}.pdf</a></code></td>
  <td>{{ .description }}</td>
  <td class="facets">
    {{ partial "facet-badges.html" . }}
  </td>
  <td class="text-end d-none d-md-table-cell">
    <div class="d-inline-flex align-items-center gap-2">
      <code class="url"><a href="{{ .url }}" class="text-decoration-none">{{ .url }}</a></code>
      <button type="button" class="btn btn-copy btn-outline-secondary btn-sm" data-copy="{{ .url }}" aria-label="Copy URL">copy</button>
    </div>
  </td>
</tr>
